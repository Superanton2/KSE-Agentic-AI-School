[project]
name = "airalert"
version = "0.1.0"
description = "Kyiv air-raid alert forecasting: data collection and validation (phase 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pandera>=0.20",
    "telethon>=1.36",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "translitua>=1.3",
    "qrcode>=7.4",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
airalert = "airalert.cli:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airalert"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008"]  # Ukrainian text is intentional; line length via `ruff format`; B008: typer.Option idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
