# Live collectors: tg-live (alerts + drone channels, one Telegram session) and the alerts.in.ua SITREP.
# The session file must already exist (run `uv run airalert tg-login` on the host).
#   AIRALERT_UID=$(id -u) AIRALERT_GID=$(id -g) docker compose up -d --build
# One-off commands that touch the SQLite journal while the collector runs (same VM => safe locking):
#   AIRALERT_UID=$(id -u) AIRALERT_GID=$(id -g) AIRALERT_CODE_SHA=$(git rev-parse HEAD) \
#     docker compose run --rm tools build
services:
  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    image: airalert-collector
    command: ["tg-live"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TG_SESSION_PATH: /session/airalert.session
    user: "${AIRALERT_UID:-10001}:${AIRALERT_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/live:/app/data/live
      - ${AIRALERT_SESSION_DIR:-~/.config/airalert}:/session
    restart: unless-stopped
    # No ports: the collector only makes outgoing connections to Telegram.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sitrep:
    image: airalert-collector
    command: ["sitrep-poll"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
    user: "${AIRALERT_UID:-10001}:${AIRALERT_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/live:/app/data/live
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airalert", "healthcheck", "--db", "sitrep"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Phase 4. Live DBs are mounted READ-ONLY: a reader in another container cannot checkpoint/delete the
  # collector's WAL (Docker Desktop does not share SQLite locks across containers).
  #   AIRALERT_UID=$(id -u) AIRALERT_GID=$(id -g) docker compose --profile serve up -d api nightly
  api:
    image: airalert-collector
    profiles: ["serve"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATA_DIR: /app/data
      WEB_DIR: /app/web
    user: "${AIRALERT_UID:-10001}:${AIRALERT_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/live:/app/data/live:ro
      - ./data/processed:/app/data/processed:ro
      - ./web:/app/web:ro
    ports:
      - "127.0.0.1:8000:8000"  # only the host itself; put a reverse proxy in front for anything else
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/state', timeout=5).status != 200)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Nightly refit at 04:00 Kyiv: read-only backup of the live alerts DB -> grid -> ensemble -> model_card.json.
  # The API picks the new files up by mtime.
  nightly:
    image: airalert-collector
    profiles: ["serve"]
    entrypoint: ["airalert", "model-fit", "--from-live", "--at", "04:00"]
    command: []
    environment:
      DATA_DIR: /app/data
      MPLCONFIGDIR: /tmp
    user: "${AIRALERT_UID:-10001}:${AIRALERT_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/live:/app/data/live:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./data/work:/app/data/work
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  tools:
    image: airalert-collector
    profiles: ["tools"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      AIRALERT_CODE_SHA: ${AIRALERT_CODE_SHA:-unknown}
      TG_SESSION_PATH: /session/airalert.session
    user: "${AIRALERT_UID:-10001}:${AIRALERT_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
